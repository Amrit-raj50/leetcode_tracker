<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode Mastery - 160 Easy Problems</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>
    
    <header>
        <div class="container">
            <div class="header-content">
                <h1>LeetCode <span>Easy</span> 160</h1>
                <p>Track your journey to mastering data structures and algorithms.</p>
            </div>
            
            <div class="stats-card">
                <div class="user-info">
                    <span class="user-name">amritrajjh17</span>
                    <span class="sync-status" id="sync-status">Synced</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="total-solved">0</span>
                    <span class="stat-label">Solved</span>
                </div>
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                    <span class="progress-text" id="progress-text">0% Completed</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="total-count">160</span>
                    <span class="stat-label">Total</span>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="controls">
            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="search-input" placeholder="Search for a problem...">
            </div>
            
            <div class="filter-wrapper">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="solved">Solved</button>
                <button class="filter-btn" data-filter="unsolved">Unsolved</button>
            </div>
        </div>

        <div class="problems-grid" id="problems-grid">
            <!-- Problem cards will be injected here -->
            <div class="loading">Loading problems...</div>
        </div>
    </main>

    <footer>
        <p>Built for efficient learning & mastery.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
